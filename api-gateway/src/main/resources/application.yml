server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: ms-coordenador-static
              uri: lb://MS-COORDENADOR
              predicates:
                - Path=/api/**
              filters:
                - AddRequestHeader=X-Gateway-Route,ms-coordenador-static

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka/,http://127.0.0.1:8762/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

gateway:
  rate-limit:
    per-second: 40

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,refresh,env
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT}
