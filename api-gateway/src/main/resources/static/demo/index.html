<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistente de livros · TP3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --st-red: #ff4b4b;
      --st-red-hover: #ff2b2b;
      --sidebar-bg: #f0f2f6;
      --bg: #ffffff;
      --ink: #31333f;
      --muted: #808495;
      --line: #d5dae5;
      --avatar-user: #ff4b4b;
      --avatar-bot: #55586b;
      --radius: 0.5rem;
      --sidebar-w: 300px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      min-height: 100%;
      overflow: hidden;
    }

    /* —— Sidebar —— */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: margin-left .2s ease, width .2s ease;
      position: relative;
      z-index: 20;
    }
    body.sidebar-collapsed #sidebar {
      margin-left: calc(-1 * var(--sidebar-w));
    }
    .sidebar-inner {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .85rem;
    }
    .collapse-btn {
      position: absolute;
      top: .65rem;
      right: .5rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: .25rem;
      border-radius: .35rem;
    }
    .collapse-btn:hover { color: var(--ink); background: #e6e9ef; }
    #expandBtn {
      display: none;
      position: fixed;
      top: .65rem;
      left: .5rem;
      z-index: 30;
      border: 1px solid var(--line);
      background: var(--sidebar-bg);
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: .35rem .45rem;
      border-radius: .35rem;
    }
    body.sidebar-collapsed #expandBtn { display: block; }

    .section-title {
      font-size: .95rem;
      font-weight: 700;
      margin: .15rem 0 0;
      letter-spacing: -0.01em;
    }
    .divider {
      height: 1px;
      background: var(--line);
      margin: .15rem 0;
      border: 0;
    }
    .st-label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin: 0 0 .35rem;
    }
    .st-help, .st-caption {
      font-size: .78rem;
      color: var(--muted);
      margin: .3rem 0 0;
      line-height: 1.35;
    }
    .widget { margin: 0; }
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: .45rem .65rem;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    input:focus, textarea:focus {
      outline: 2px solid #ff4b4b55;
      border-color: var(--st-red);
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: .55rem;
      font-size: .9rem;
      cursor: pointer;
      user-select: none;
    }
    .toggle input {
      width: 1rem;
      height: 1rem;
      accent-color: var(--st-red);
    }
    #livroFields {
      display: grid;
      gap: .65rem;
      margin-top: .35rem;
    }
    #livroFields[hidden] { display: none !important; }

    .btn {
      border: 0;
      border-radius: var(--radius);
      padding: .55rem .85rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn-secondary {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .btn-secondary:hover:not(:disabled) { border-color: #adb5bd; }
    .btn-row {
      display: grid;
      gap: .45rem;
    }

    details.debug {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: .35rem .55rem .55rem;
    }
    details.debug summary {
      cursor: pointer;
      font-weight: 600;
      font-size: .9rem;
      padding: .25rem 0;
      list-style: none;
    }
    details.debug summary::-webkit-details-marker { display: none; }
    details.debug summary::before {
      content: "▸ ";
      color: var(--muted);
    }
    details.debug[open] summary::before { content: "▾ "; }
    #debugOut {
      margin: .4rem 0 0;
      max-height: 14rem;
      overflow: auto;
      font-size: .72rem;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--sidebar-bg);
      border-radius: .35rem;
      padding: .5rem;
      color: var(--ink);
    }

    /* —— Main —— */
    .app {
      flex: 1;
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .block-container {
      max-width: 46rem;
      width: 100%;
      margin: 0 auto;
      padding: 1.35rem 1.5rem 0;
    }
    .block-container h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .block-container .caption {
      margin: .35rem 0 0;
      color: var(--muted);
      font-size: .95rem;
    }

    #thread {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem 1.25rem;
    }
    #threadInner {
      max-width: 46rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .chat-msg {
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: .75rem;
      align-items: start;
    }
    .avatar {
      width: 2rem;
      height: 2rem;
      border-radius: .45rem;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar.user { background: var(--avatar-user); }
    .avatar.assistant { background: var(--avatar-bot); }
    .msg-body {
      min-width: 0;
      padding-top: .15rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-body.loading {
      color: var(--muted);
      font-style: italic;
    }
    .msg-body.error { color: #9b1c1c; }
    .plano {
      margin-top: .65rem;
      padding: .65rem .75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--sidebar-bg);
      font-size: .9rem;
      white-space: normal;
    }
    .plano ul { margin: .35rem 0 0; padding-left: 1.1rem; }
    .plano-title { font-weight: 700; margin-bottom: .25rem; }

    /* —— Bottom chat input —— */
    .st-bottom {
      border-top: 1px solid transparent;
      padding: .35rem 1.5rem 1.15rem;
      background: linear-gradient(to top, #fff 70%, #ffffffcc);
    }
    .st-bottom-inner {
      max-width: 46rem;
      margin: 0 auto;
    }
    .chat-input {
      display: flex;
      align-items: flex-end;
      gap: .5rem;
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      padding: .45rem .5rem .45rem .9rem;
      background: #fff;
      box-shadow: 0 1px 2px #31333f0a;
    }
    .chat-input:focus-within {
      border-color: #ff4b4b88;
      box-shadow: 0 0 0 2px #ff4b4b22;
    }
    .chat-input textarea {
      border: 0;
      outline: none;
      resize: none;
      flex: 1;
      min-height: 1.5rem;
      max-height: 7.5rem;
      padding: .35rem 0;
      background: transparent;
      box-shadow: none;
      line-height: 1.4;
    }
    .chat-input textarea:focus {
      outline: none;
      border: 0;
      box-shadow: none;
    }
    .send-btn {
      width: 2.15rem;
      height: 2.15rem;
      border: 0;
      border-radius: 999px;
      background: var(--st-red);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) { background: var(--st-red-hover); }
    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .send-btn svg { width: 1.05rem; height: 1.05rem; display: block; }
    .input-hint {
      margin: .45rem 0 0;
      font-size: .75rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 800px) {
      body { overflow: auto; }
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        box-shadow: 4px 0 16px #00000014;
      }
      body.sidebar-collapsed #sidebar { margin-left: calc(-1 * var(--sidebar-w)); }
      .app { width: 100%; }
    }
  </style>
</head>
<body>
  <button type="button" id="expandBtn" title="Abrir sidebar" aria-label="Abrir sidebar">»</button>

  <aside id="sidebar" aria-label="Configurações">
    <button type="button" class="collapse-btn" id="collapseBtn" title="Recolher sidebar" aria-label="Recolher sidebar">«</button>
    <div class="sidebar-inner">
      <h2 class="section-title">Conversa</h2>
      <div class="widget">
        <label class="st-label" for="conversationId">conversationId</label>
        <input id="conversationId" type="text" value="" />
        <p class="st-caption" id="convCaption">Chat ID atual: —</p>
        <p class="st-help">Mesmo id mantém Chat Memory entre turnos.</p>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" id="newConv">Novo conversationId</button>
        <button type="button" class="btn btn-secondary" id="clear">Limpar conversa</button>
      </div>

      <hr class="divider" />

      <h2 class="section-title">Plano de leitura</h2>
      <label class="toggle">
        <input type="checkbox" id="gerarPlano" />
        <span>gerarPlano (Lambda)</span>
      </label>
      <div id="livroFields" hidden>
        <div class="widget">
          <label class="st-label" for="titulo">Título</label>
          <input id="titulo" type="text" value="Neuromancer" />
        </div>
        <div class="widget">
          <label class="st-label" for="autor">Autor</label>
          <input id="autor" type="text" value="William Gibson" />
        </div>
        <div class="widget">
          <label class="st-label" for="paginas">Páginas</label>
          <input id="paginas" type="number" value="271" min="1" />
        </div>
        <div class="widget">
          <label class="st-label" for="dias">Dias</label>
          <input id="dias" type="number" value="14" min="1" />
        </div>
      </div>

      <hr class="divider" />

      <h2 class="section-title">API</h2>
      <div class="widget">
        <label class="st-label" for="apiBase">Endpoint POST</label>
        <input id="apiBase" type="text" value="/api/assistant/chat" />
        <p class="st-help">Padrão: Gateway neste host.</p>
      </div>

      <hr class="divider" />

      <details class="debug">
        <summary>Debug</summary>
        <pre id="debugOut">Sem chamadas ainda.</pre>
      </details>
    </div>
  </aside>

  <div class="app">
    <div class="block-container">
      <h1>Assistente de livros</h1>
    </div>

    <div id="thread">
      <div id="threadInner"></div>
    </div>

    <div class="st-bottom">
      <div class="st-bottom-inner">
        <div class="chat-input">
          <textarea id="message" rows="1" placeholder="Digite sua mensagem..." aria-label="Mensagem"></textarea>
          <button type="button" class="send-btn" id="send" title="Enviar" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">Enter envia · Shift+Enter nova linha</p>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const threadInner = $("threadInner");
    const thread = $("thread");
    let loadingEl = null;

    function newChatId() {
      const bytes = crypto.getRandomValues(new Uint8Array(12));
      return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    }

    function syncCaption() {
      const id = $("conversationId").value.trim() || "—";
      $("convCaption").textContent = "Chat ID atual: " + id;
    }

    $("conversationId").value = newChatId();
    syncCaption();

    $("conversationId").addEventListener("input", syncCaption);
    $("gerarPlano").addEventListener("change", (e) => {
      $("livroFields").hidden = !e.target.checked;
    });

    $("collapseBtn").addEventListener("click", () => {
      document.body.classList.add("sidebar-collapsed");
    });
    $("expandBtn").addEventListener("click", () => {
      document.body.classList.remove("sidebar-collapsed");
    });

    $("newConv").addEventListener("click", () => {
      $("conversationId").value = newChatId();
      syncCaption();
    });

    $("clear").addEventListener("click", () => {
      threadInner.innerHTML = "";
      loadingEl = null;
      setDebug("Conversa limpa.");
      setLoading(false);
    });

    function esc(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function setDebug(text) {
      $("debugOut").textContent = text;
    }

    function setLoading(on) {
      const controls = [
        $("send"), $("message"), $("conversationId"), $("apiBase"),
        $("gerarPlano"), $("titulo"), $("autor"), $("paginas"), $("dias"),
        $("newConv"), $("clear")
      ];
      controls.forEach((el) => { el.disabled = on; });
      $("message").placeholder = on ? "Aguardando resposta..." : "Digite sua mensagem...";
    }

    function addMessage(role, html, opts = {}) {
      const row = document.createElement("div");
      row.className = "chat-msg";
      if (opts.loading) row.dataset.loading = "1";

      const av = document.createElement("div");
      av.className = "avatar " + (role === "user" ? "user" : "assistant");
      av.textContent = role === "user" ? "U" : "AI";

      const body = document.createElement("div");
      body.className = "msg-body" + (opts.loading ? " loading" : "") + (opts.error ? " error" : "");
      body.innerHTML = html;

      row.appendChild(av);
      row.appendChild(body);
      threadInner.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      return row;
    }

    function autoGrow() {
      const ta = $("message");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    }
    $("message").addEventListener("input", autoGrow);

    async function send() {
      const message = $("message").value.trim();
      if (!message || $("send").disabled) return;

      const conversationId = $("conversationId").value.trim() || newChatId();
      const gerarPlano = $("gerarPlano").checked;
      const body = { conversationId, message, gerarPlano };
      if (gerarPlano) {
        body.livro = {
          titulo: $("titulo").value.trim(),
          autor: $("autor").value.trim(),
          paginasEstimadas: Number($("paginas").value) || 200,
          diasDisponiveis: Number($("dias").value) || 14
        };
      }

      addMessage("user", esc(message));
      $("message").value = "";
      autoGrow();
      setLoading(true);
      loadingEl = addMessage("assistant", "_Aguardando resposta..._", { loading: true });
      const t0 = performance.now();

      try {
        const res = await fetch($("apiBase").value, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const raw = await res.text();
        const ms = Math.round(performance.now() - t0);
        let data = null;
        try { data = JSON.parse(raw); } catch (_) {}

        if (loadingEl) {
          loadingEl.remove();
          loadingEl = null;
        }

        setDebug(
          "HTTP " + res.status + " · " + ms + "ms\n\n" +
          "— request —\n" + JSON.stringify(body, null, 2) + "\n\n" +
          "— response —\n" + (data ? JSON.stringify(data, null, 2) : raw.slice(0, 4000))
        );

        if (!res.ok) {
          addMessage("assistant", esc(raw.slice(0, 2500)), { error: true });
          return;
        }

        const reply = data?.reply ?? raw;
        let html = esc(reply);
        if (data?.plano) {
          const p = data.plano;
          const items = (p.checklist || []).map((i) => `<li>${esc(i)}</li>`).join("");
          html += `<div class="plano"><div class="plano-title">Plano Lambda</div>${esc(p.titulo || "")} · ${esc(String(p.paginasPorDia))} pág/dia · ${esc(String(p.diasDisponiveis))} dias<br>${esc(p.mensagem || "")}<ul>${items}</ul></div>`;
        }
        addMessage("assistant", html);
      } catch (e) {
        if (loadingEl) {
          loadingEl.remove();
          loadingEl = null;
        }
        setDebug("Falha de rede: " + (e.message || e));
        addMessage("assistant", esc(e.message || e), { error: true });
      } finally {
        setLoading(false);
        $("message").focus();
      }
    }

    $("send").addEventListener("click", send);
    $("message").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    syncCaption();
  </script>
</body>
</html>
