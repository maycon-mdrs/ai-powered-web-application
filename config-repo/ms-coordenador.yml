lambda:
  base-url: ${LAMBDA_BASE_URL:http://localhost:9000}

chaos:
  monkey:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      msIa:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
      lambda:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  bulkhead:
    instances:
      msIa:
        maxConcurrentCalls: 8
      lambda:
        maxConcurrentCalls: 4
  ratelimiter:
    instances:
      msIa:
        limitForPeriod: 15
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      lambda:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
