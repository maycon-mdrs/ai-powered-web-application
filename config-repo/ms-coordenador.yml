ms-ia:
  base-url: ${MS_IA_BASE_URL:http://MS-IA}

lambda:
  base-url: ${LAMBDA_BASE_URL:http://localhost:9000}

http:
  client:
    connect-timeout: 3s
    read-timeout: 90s

chaos:
  monkey:
    enabled: ${CHAOS_MONKEY_ENABLED:false}
    assaults:
      level: 5
      latencyActive: true
      exceptionsActive: true
      latencyRangeStart: 1000
      latencyRangeEnd: 3000
    watcher:
      restController: true
      service: true

resilience4j:
  circuitbreaker:
    instances:
      msIa:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      lambda:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        registerHealthIndicator: true
  retry:
    instances:
      msIa:
        maxAttempts: 3
        waitDuration: 500ms
      lambda:
        maxAttempts: 2
        waitDuration: 300ms
  bulkhead:
    instances:
      msIa:
        maxConcurrentCalls: 8
      lambda:
        maxConcurrentCalls: 4
  ratelimiter:
    instances:
      msIa:
        limitForPeriod: 15
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      lambda:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
