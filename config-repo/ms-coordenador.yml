ms-ia:
  base-url: ${MS_IA_BASE_URL:http://MS-IA}

lambda:
  base-url: ${LAMBDA_BASE_URL:http://localhost:9000}

http:
  client:
    connect-timeout: 3s
    read-timeout: 45s

# Assaults off por default; na demo: POST /actuator/chaosmonkey/enable
# (endpoint exige profile chaos-monkey + chaos-monkey-spring-boot 4.x)
chaos:
  monkey:
    enabled: ${CHAOS_MONKEY_ENABLED:false}

resilience4j:
  circuitbreaker:
    instances:
      msIa:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
      lambda:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  bulkhead:
    instances:
      msIa:
        maxConcurrentCalls: 8
      lambda:
        maxConcurrentCalls: 4
  ratelimiter:
    instances:
      msIa:
        limitForPeriod: 15
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      lambda:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
