server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # native = pasta local; git = repositório (demo de refresh dinâmico)
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:file:../config-repo}
        git:
          uri: ${CONFIG_GIT_URI:file:///${user.dir}/../config-repo}
          default-label: main
          clone-on-start: true
          search-paths: .

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
