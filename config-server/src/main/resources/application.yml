server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # native: filesystem; git: remote repository (CONFIG_GIT_URI)
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:file:../config-repo}
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/maycon-mdrs/ai-powered-web-application.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          clone-on-start: true
          search-paths: ${CONFIG_GIT_SEARCH_PATHS:config-repo}
          force-pull: ${CONFIG_GIT_FORCE_PULL:true}
          # Private repo: SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME / _PASSWORD

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
