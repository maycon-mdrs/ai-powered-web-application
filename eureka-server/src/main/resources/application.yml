server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      # Cluster: peer A (8761) e peer B (8762) apontam um para o outro.
      # Peer B: EUREKA_PORT=8762 EUREKA_HOSTNAME=localhost defaultZone=http://localhost:8761/eureka/
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8762/eureka/}
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
