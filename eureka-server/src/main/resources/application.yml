spring:
  application:
    name: eureka-server
  profiles:
    active: ${EUREKA_PEER:peer1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
