server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-coordenador
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents

# lambda.base-url vem do config-repo / env na implementação
