server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-coordenador
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka/,http://127.0.0.1:8762/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    non-secure-port: ${server.port}
    instance-id: ${EUREKA_INSTANCE_HOSTNAME:${spring.application.name}}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

ms-ia:
  # Service id Eureka (LoadBalanced). Trocar aqui / Config Server, não no Java.
  base-url: ${MS_IA_BASE_URL:http://MS-IA}

lambda:
  base-url: ${LAMBDA_BASE_URL:http://localhost:9000}

http:
  client:
    connect-timeout: 3s
    read-timeout: 90s


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh,circuitbreakers,circuitbreakerevents,ratelimiters,retries,bulkheads,chaosmonkey
  endpoint:
    health:
      show-details: always
    # Boot 4: access (não só enabled) — senão /actuator/chaosmonkey fica 404
    chaosmonkey:
      access: unrestricted
    chaosmonkeyjmx:
      access: unrestricted
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT}

resilience4j:
  circuitbreaker:
    instances:
      msIa:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      lambda:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        registerHealthIndicator: true
  retry:
    instances:
      msIa:
        maxAttempts: 3
        waitDuration: 500ms
      lambda:
        maxAttempts: 2
        waitDuration: 300ms
  bulkhead:
    instances:
      msIa:
        maxConcurrentCalls: 8
      lambda:
        maxConcurrentCalls: 4
  ratelimiter:
    instances:
      msIa:
        limitForPeriod: 15
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      lambda:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

# Assaults começam desligados; ligar na demo via POST /actuator/chaosmonkey/enable
# (profile chaos-monkey ativa a auto-config — ver SPRING_PROFILES_ACTIVE no Compose)
chaos:
  monkey:
    enabled: ${CHAOS_MONKEY_ENABLED:false}
    assaults:
      level: 5
      latencyActive: true
      exceptionsActive: true
      latencyRangeStart: 1000
      latencyRangeEnd: 3000
    watcher:
      restController: true
      service: true
