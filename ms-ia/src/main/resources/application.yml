server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-ia
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  graphql:
    graphiql:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
    google:
      genai:
        api-key: ${GEMINI_API_KEY:not-set}
        chat:
          options:
            model: gemini-3.5-flash-lite
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        request-timeout: 30s
        stdio:
          connections:
            open-library:
              command: ${MCP_COMMAND:cmd.exe}
              args:
                - /c
                - npx
                - -y
                - mcp-open-library
  cloud:
    vault:
      enabled: false

ai:
  provider: ${AI_PROVIDER:gemini}
  stub: ${AI_STUB:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka/,http://127.0.0.1:8762/eureka/}
  instance:
    prefer-ip-address: true
    # Em EC2 o IP público quebra o LB local; sobrescreva com o IP privado na AWS.
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

---
spring:
  config:
    activate:
      on-profile: vault
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - vault://
  cloud:
    vault:
      enabled: true
      fail-fast: true
      uri: ${VAULT_URI:http://127.0.0.1:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
        default-context: ms-ia
        application-name: ms-ia

ai:
  stub: false

