server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-ia
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  graphql:
    graphiql:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
    google:
      genai:
        api-key: ${GEMINI_API_KEY:not-set}
        chat:
          options:
            model: gemini-3.5-flash-lite
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        # Tempo do cliente Spring → processo MCP (stdio). O axios interno do
        # mcp-open-library é outro limite (patch 60s no Dockerfile.ms-ia).
        request-timeout: 180s
        stdio:
          connections:
            open-library:
              # Windows default; Docker: ver application-docker.yml
              command: ${MCP_COMMAND:cmd.exe}
              args:
                - ${MCP_ARG_0:/c}
                - ${MCP_ARG_1:npx}
                - ${MCP_ARG_2:-y}
                - ${MCP_ARG_3:mcp-open-library}
  cloud:
    vault:
      enabled: false

ai:
  provider: gemini
  stub: true

# Segredos LANGSMITH_* vêm do Vault (perfil vault). Nunca versionar a API key.
langsmith:
  tracing: ${LANGSMITH_TRACING:false}
  api-key: ${LANGSMITH_API_KEY:}
  endpoint: ${LANGSMITH_ENDPOINT:https://api.smith.langchain.com}
  project: ${LANGSMITH_PROJECT:tp3-assistente-livros}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka/,http://127.0.0.1:8762/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    # Compose: EUREKA_INSTANCE_HOSTNAME=<serviço> e EUREKA_PREFER_IP=false
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh,env
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT}

---
spring:
  config:
    activate:
      on-profile: vault
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - vault://
  cloud:
    vault:
      enabled: true
      fail-fast: true
      uri: ${VAULT_URI:http://127.0.0.1:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
        profiles: []
        default-context: ms-ia
        application-name: ms-ia

