server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-ia
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  graphql:
    graphiql:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# ai.provider=gemini|openai — ver config-repo/ms-ia.yml
