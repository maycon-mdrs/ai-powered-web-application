global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: ms-coordenador
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081", "host.docker.internal:8083"]
  - job_name: ms-ia
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
  - job_name: ms-lambda
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9000"]
