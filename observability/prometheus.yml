global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
  - job_name: ms-coordenador
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ms-coordenador-a:8081", "ms-coordenador-b:8083"]
  - job_name: ms-ia
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ms-ia:8082"]
  - job_name: ms-lambda
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ms-lambda:9000"]
